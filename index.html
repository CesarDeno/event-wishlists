<!doctype html>
<html lang="es">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
      />
      <meta name="color-scheme" content="light dark" />
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
      <title>Wishlist</title>
      <meta
         name="description"
         content="Listas de regalos por evento con presupuesto tope, precios aproximados y enlaces directos."
      />
      <meta property="og:type" content="website" />
      <meta property="og:locale" content="es_MX" />
      <meta property="og:site_name" content="Wishlist - Cesar Denogean" />
      <meta property="og:title" content="Wishlist - Cesar Denogean" />
      <meta
         property="og:description"
         content="Listas de regalos por evento con presupuesto tope, precios aproximados y enlaces directos."
      />
      <meta property="og:url" content="https://wishlist.denogean.dev/" />
      <meta property="og:image" content="https://wishlist.denogean.dev/og-image.png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Wishlist - Cesar Denogean" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Wishlist - Cesar Denogean" />
      <meta
         name="twitter:description"
         content="Listas de regalos por evento con presupuesto tope, precios aproximados y enlaces directos."
      />
      <meta name="twitter:image" content="https://wishlist.denogean.dev/og-image.png" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <script>
         (() => {
            try {
               const saved = localStorage.getItem("theme");
               const theme =
                  saved === "light" || saved === "dark"
                     ? saved
                     : matchMedia("(prefers-color-scheme: dark)").matches
                       ? "dark"
                       : "light";
               document.documentElement.dataset.theme = theme;
            } catch {}
         })();
      </script>
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
