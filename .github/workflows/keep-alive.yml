name: Keep Supabase Active

on:
  schedule:
    # Cada 3 días a las 09:17 UTC para evitar pausas tras 7 días de inactividad
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL via REST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY en GitHub Actions."
            exit 1
          fi

          curl -fsS "${SUPABASE_URL%/}/rest/v1/lists?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" > /dev/null
          echo "Supabase ping OK"

